<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Laboratorio Informático</title>
  <link rel="stylesheet" href="tobiduar.css">
  <!-- CDN de Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Sistema de Gestión de Equipos y Componentes</h1>
      <p>Laboratorio Informático - CNEAE</p>
    </header>

    <!-- Formulario de Registro / Edición -->
    <section class="card">
      <h2 id="form-title">Registrar Componente</h2>
      <form id="componente-form">
        <input type="hidden" id="componente-id">
        
        <div class="form-group">
          <label>Código (*):</label>
          <input type="text" id="codigo" required placeholder="Ej: ARD001">
        </div>

        <div class="form-group">
          <label>Nombre (*):</label>
          <input type="text" id="nombre" required placeholder="Ej: Arduino Uno">
        </div>

        <div class="form-group">
          <label>Categoría (*):</label>
          <select id="categoria" required>
            <option value="">Seleccione...</option>
            <option value="Arduino">Arduino</option>
            <option value="Sensores">Sensores</option>
            <option value="Computadoras">Computadoras</option>
            <option value="Monitores">Monitores</option>
            <option value="Periféricos">Periféricos</option>
            <option value="Componentes electrónicos">Componentes electrónicos</option>
            <option value="Herramientas">Herramientas</option>
            <option value="Redes">Redes</option>
            <option value="Otros">Otros</option>
          </select>
        </div>

        <div class="form-group">
          <label>Marca (*):</label>
          <input type="text" id="marca" required placeholder="Ej: Genérico">
        </div>

        <div class="form-group">
          <label>Cantidad (*):</label>
          <input type="number" id="cantidad" min="0" required placeholder="0">
        </div>

        <div class="form-group">
          <label>Estado (*):</label>
          <select id="estado" required>
            <option value="">Seleccione...</option>
            <option value="Disponible">Disponible</option>
            <option value="En uso">En uso</option>
            <option value="Reparación">Reparación</option>
            <option value="Baja">Baja</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>Descripción:</label>
          <textarea id="descripcion" rows="2"></textarea>
        </div>

        <div class="form-actions full-width">
          <button type="submit" id="btn-guardar" class="btn btn-primary">Guardar</button>
          <button type="button" id="btn-cancelar" class="btn btn-secondary" style="display:none;">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Filtros y Buscador -->
    <section class="card">
      <h2>Inventario de Componentes</h2>
      <div class="filters">
        <input type="text" id="search-input" placeholder="Buscar por código, nombre o marca...">
        <select id="filter-categoria">
          <option value="">Todas las categorías</option>
          <option value="Arduino">Arduino</option>
          <option value="Sensores">Sensores</option>
          <option value="Computadoras">Computadoras</option>
          <option value="Monitores">Monitores</option>
          <option value="Periféricos">Periféricos</option>
          <option value="Componentes electrónicos">Componentes electrónicos</option>
          <option value="Herramientas">Herramientas</option>
          <option value="Redes">Redes</option>
          <option value="Otros">Otros</option>
        </select>
        <select id="filter-estado">
          <option value="">Todos los estados</option>
          <option value="Disponible">Disponible</option>
          <option value="En uso">En uso</option>
          <option value="Reparación">Reparación</option>
          <option value="Baja">Baja</option>
        </select>
      </div>

      <!-- Tabla de Listado -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Marca</th>
              <th>Cantidad</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <!-- Datos renderizados mediante JS -->
          </tbody>
        </table>
      </div>
    </section>
  </div>
  <!-- Cargar librería de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Cargar tu archivo JavaScript (con el nombre exacto) -->
<script src="tobicrip.js"></script>
</body>
</html>
